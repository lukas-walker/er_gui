<section id="reset-controls" class="mb-6 scroll-mt-24">
  <h2 class="text-2xl font-bold mb-3">Resets</h2>

  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <div class="flex items-center justify-between gap-3">
        <h3 class="card-title">Puzzle resets</h3>
      </div>

      <p class="opacity-70 text-sm mt-1">
        These are high-impact operations. All actions require confirmation.
      </p>

      <div class="mt-4 grid grid-cols-1 lg:grid-cols-2 gap-3">
        <button
          class="btn btn-error btn-outline"
          onclick="openActionModal('Reset Clickwork+Deepfake pipeline', '/reset/clickwork_deepfake', true)"
        >
          A Clickwork+Deepfake
        </button>

        <button
          class="btn btn-error btn-outline"
        >
          B
        </button>

        <button
          class="btn btn-warning btn-outline"
        >
          C
        </button>

        <button
          class="btn btn-warning btn-outline"
        >
          D
        </button>

        <button
          class="btn btn-error btn-outline"
          onclick="openActionModal('Full reset (default_state + extended + logs)', '/reset', true)"
        >
          RESET ALL
        </button>
      </div>

      <p class="opacity-70 text-sm mt-3">
        Tip: the first button calls <code>POST /reset/clickwork_deepfake</code> on the Pi via the proxy.
      </p>
    </div>
  </div>
</section>
