<section id="reset-controls" class="mb-6 scroll-mt-24">

      <div class="flex items-center justify-between gap-3">
        <h3 class="card-title">Puzzle resets</h3>
      </div>

      <p class="opacity-70 text-sm mt-1">
        These are high-impact operations. All actions require confirmation.
      </p>

      <div class="mt-4 grid grid-cols-1 lg:grid-cols-2 gap-3">
        <!-- 1) Clickwork + Deepfake pipeline reset -->
        <button

        >
          Full reset (defaults)
        </button>

        <!-- 3) Placeholder -->
        <button
          class="btn btn-error btn-outline"

        </button>

        <!-- 4) Placeholder -->
        <button
          class="btn btn-error btn-outline"
          disabled
          title="TODO: implement endpoint on Pi server"
        >
          Reset #4 (TODO)
        </button>
