<section id="advanced-controls" class="mt-10 scroll-mt-24">
  <h2 class="text-2xl font-bold mb-4">Advanced Controls</h2>

  <div class="collapse collapse-arrow bg-base-200 mb-2">
    <input type="checkbox" />
    <div class="collapse-title text-xl font-medium">Puzzle 1 Settings</div>
    <div class="collapse-content">
      <p class="opacity-70">More controls will be here…</p>
    </div>
  </div>

  <div class="collapse collapse-arrow bg-base-200 mb-2">
    <input type="checkbox" />
    <div class="collapse-title text-xl font-medium">Lighting System</div>
    <div class="collapse-content">
      <p class="opacity-70">Coming soon…</p>
    </div>
  </div>

  <div class="mt-6">
  <h2 class="text-2xl font-bold mb-4">State</h2>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

    <!-- Live viewer -->
    <div class="card bg-base-100 shadow-xl">
      <div class="card-body">
        <div class="flex items-center justify-between">
          <h3 class="card-title">Live State (read-only)</h3>
          <button id="toggle-live" class="btn btn-sm btn-outline" onclick="toggleLive()">
            Pause
          </button>
        </div>

        <pre id="state-live"
             class="mt-3 p-3 rounded bg-base-200 text-sm font-mono overflow-auto"
             style="max-height: 420px;">…</pre>

        <div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3">
          <button class="btn btn-outline w-full" onclick="copyLiveToEditor()">
            Load snapshot → editor
          </button>
          <button class="btn btn-ghost w-full" onclick="copyLiveToClipboard()">
            Copy live JSON
          </button>
        </div>
      </div>
    </div>

    <!-- Editor -->
    <div class="card bg-base-100 shadow-xl">
      <div class="card-body">
        <h3 class="card-title">Editor (frozen)</h3>

        <textarea
          id="state-editor"
          class="textarea textarea-bordered font-mono w-full mt-3"
          rows="16"
          placeholder='Click "Load snapshot → editor", then edit here...'
        ></textarea>

        <div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3">
          <button class="btn btn-outline w-full" onclick="formatEditorJson()">
            Format JSON
          </button>
          <label for="modal-set-state" class="btn btn-primary w-full">
            Apply from editor
          </label>
        </div>

        <p id="state-error" class="text-sm text-error mt-2 hidden"></p>
        <p id="state-success" class="text-sm text-success mt-2 hidden"></p>
      </div>
    </div>

  </div>
</div>
</section>
