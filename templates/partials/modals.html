<!-- RESET MODAL -->
<input type="checkbox" id="modal-reset" class="modal-toggle" />
<div class="modal">
  <div class="modal-box">
    <h3 class="font-bold text-lg">Confirm reset?</h3>
    <div class="modal-action">
      <label for="modal-reset" class="btn btn-ghost">Cancel</label>
      <label for="modal-reset" class="btn btn-info" onclick="doReset()">Confirm</label>
    </div>
  </div>
</div>

<!-- REBOOT MODAL -->
<input type="checkbox" id="modal-reboot" class="modal-toggle" />
<div class="modal">
  <div class="modal-box">
    <h3 class="font-bold text-lg">Confirm reboot?</h3>
    <div class="modal-action">
      <label for="modal-reboot" class="btn btn-ghost">Cancel</label>
      <label for="modal-reboot" class="btn btn-warning" onclick="doReboot()">Confirm</label>
    </div>
  </div>
</div>

<!-- SHUTDOWN MODAL -->
<input type="checkbox" id="modal-shutdown" class="modal-toggle" />
<div class="modal">
  <div class="modal-box">
    <h3 class="font-bold text-lg">Confirm shutdown?</h3>
    <div class="modal-action">
      <label for="modal-shutdown" class="btn btn-ghost">Cancel</label>
      <label for="modal-shutdown" class="btn btn-error" onclick="doShutdown()">Confirm</label>
    </div>
  </div>
</div>
